      <p class="lead">Finn oppskrifter fra restene dine – eller søk på vanlig måte.</p>
    </header>
    <div id="rf"></div>
    <p class="foot">Laget av <a href="/">Uka</a>. Bruker du Uka, finner du Restefest som egen fane der – med familiens oppskrifter og «legg i ukemenyen».</p>
  </main>
  <script type="module">
    import { mountRestefest } from "./restefest.js";
    // Frittstående: familiens oppskrifter hentes hvis denne enheten er med i en Uka-familie.
    const code = (() => { try { return localStorage.getItem("code"); } catch { return null; } })();
    let family = [];
    const rf = mountRestefest(document.querySelector("#rf"), {
      familyRecipes: () => family,
      importLink: code ? async (url) => {
        const out = await (await fetch(`/api/recipes/${encodeURIComponent(code)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) })).json();
        if (out.ok) family = [...family.filter((r) => r.url !== out.recipe.url), out.recipe];
        return out;
      } : null,
    });
    if (code) fetch(`/api/recipes/${encodeURIComponent(code)}`).then((r) => r.json()).then((d) => { family = d.recipes || []; rf.render(); }).catch(() => {});
  </script>
