<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Restefest – finn oppskrifter på det du har</title>
  <meta name="description" content="Skriv inn restene dine, så finner Restefest norske oppskrifter som bruker dem.">
  <meta property="og:title" content="Restefest">
  <meta property="og:description" content="Skriv inn restene dine, så finner Restefest norske oppskrifter som bruker dem.">
  <meta name="theme-color" content="#ece4e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#421b2e" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="restefest.css">
  <link rel="stylesheet" href="komponent.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>Restefest</h1>
      <p class="lead">Skriv inn det du har rester av, så finner vi oppskrifter som bruker det.</p>
    </header>
    <div id="rf"></div>
    <p class="foot">Laget av <a href="/">Uka</a>. Bruker du Uka, finner du Restefest som egen fane der – med familiens oppskrifter og «legg i ukemenyen».</p>
  </main>
  <script type="module">
    import { mountRestefest } from "./restefest.js";
    // Frittstående: familiens oppskrifter hentes hvis denne enheten er med i en Uka-familie.
    const code = (() => { try { return localStorage.getItem("code"); } catch { return null; } })();
    let family = [];
    const rf = mountRestefest(document.querySelector("#rf"), {
      familyRecipes: () => family,
      importLink: code ? async (url) => {
        const out = await (await fetch(`/api/recipes/${encodeURIComponent(code)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) })).json();
        if (out.ok) family = [...family.filter((r) => r.url !== out.recipe.url), out.recipe];
        return out;
      } : null,
    });
    if (code) fetch(`/api/recipes/${encodeURIComponent(code)}`).then((r) => r.json()).then((d) => { family = d.recipes || []; rf.render(); }).catch(() => {});
  </script>
</body>
</html>
