name = "uka"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Forsiden går via workeren, slik at OpenGraph-adressene kan gjøres absolutte.
run_worker_first = ["/", "/index.html"]

[[durable_objects.bindings]]
name = "FAMILY"
class_name = "Family"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Family"]
